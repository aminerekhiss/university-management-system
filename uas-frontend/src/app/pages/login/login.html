<div class="login-container">

  <!-- LEFT SIDE -->
  <div class="left-panel">
    <h1>Welcome Back to <span>UniPay</span></h1>
    <p>
      Secure access to your university financial dashboard.<br />
      Tuition payments, payroll, budgets — all in one place.
    </p>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <form class="login-form" [formGroup]="form" (ngSubmit)="login()">


      <h2>Login to Your Account</h2>

      <!-- ROLE SELECTOR -->
      <div class="role-pills">
        <button type="button" class="pill" [class.active]="selectedRole === 'student'"
          (click)="selectedRole = 'student'">
          Student
        </button>

        <button type="button" class="pill" [class.active]="selectedRole === 'staff'" (click)="selectedRole = 'staff'">
          Staff
        </button>

        <button type="button" class="pill" [class.active]="selectedRole === 'admin'" (click)="selectedRole = 'admin'">
          Admin
        </button>
      </div>

      <!-- EMAIL -->
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="example@unipay.com" />
        <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error-text">
          <small *ngIf="form.get('email')?.errors?.['required']">Email is required</small>
          <small *ngIf="form.get('email')?.errors?.['email']">Invalid email format</small>
        </div>
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Enter your password" />
        <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="error-text">
          <small *ngIf="form.get('password')?.errors?.['required']">Password is required</small>
          <small *ngIf="form.get('password')?.errors?.['minlength']">Password must be at least 4 chars</small>
        </div>
      </div>

      <!-- REMEMBER ME -->
      <div class="form-group remember">
        <label>
          <input type="checkbox" formControlName="rememberMe" />
          Remember me
        </label>
      </div>

      <!-- SUBMIT -->
      <button type="submit" class="login-btn" [disabled]="form.invalid">Login</button>

      <p class="signup-link">
        Don't have an account?
        <a routerLink="/signup">Sign up</a>
      </p>

    </form>
  </div>

  <!-- Optional Decorative Background -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

</div>
